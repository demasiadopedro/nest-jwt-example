services:

  postgres:
    container_name: jwt-example-postgres
    image: bitnami/postgresql:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: jwt-example-BD
    ports:
      - 5432:5432
    volumes:
      - postgresql_data:/bitnami/postgresql/
volumes:
  postgresql_data:
